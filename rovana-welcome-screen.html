<title>Rovana — Fleet operations sign in</title>
<meta name="description" content="Rovana keeps trucks, drivers, defects and daily fleet records in one place. Run the road, not the paperwork.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FAF6EF;
    --forest: #14532D;
    --orange: #E8590C;
    --orange-dark: #D9480F;
    --card: #FFFFFF;
    --border: #E7DFD0;
    --muted: #6B7264;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'DM Sans', system-ui, sans-serif;
    background: var(--cream);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
    color: var(--forest);
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 2rem;
    box-shadow: 0 24px 60px -24px rgba(20, 83, 45, 0.25);
    width: 100%;
    max-width: 28rem;
    padding: 3rem 2.5rem;
  }
  .brand { display: flex; align-items: center; gap: 1rem; }
  .brand img { width: 56px; height: 56px; }
  .brand h2 {
    font-family: 'Fraunces', serif;
    font-size: 1.875rem;
    font-weight: 700;
    line-height: 1;
    letter-spacing: -0.02em;
  }
  .eyebrow {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  .brand .eyebrow { color: var(--muted); margin-top: 0.3rem; }
  .section-eyebrow { color: var(--orange); margin-top: 2.5rem; }
  h1 {
    font-family: 'Fraunces', serif;
    font-size: 2.25rem;
    font-weight: 700;
    line-height: 1.15;
    letter-spacing: -0.02em;
    margin-top: 0.5rem;
  }
  .sub { color: var(--muted); margin-top: 0.75rem; font-size: 1rem; }
  form { margin-top: 2rem; display: flex; flex-direction: column; gap: 1.25rem; }
  label { display: block; }
  label span { color: var(--muted); }
  input {
    margin-top: 0.5rem;
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 1rem;
    padding: 1rem 1.25rem;
    font-size: 1rem;
    font-family: inherit;
    background: var(--card);
    color: var(--forest);
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  input:focus { border-color: var(--orange); box-shadow: 0 0 0 4px rgba(232, 89, 12, 0.15); }
  input::placeholder { color: #A9A89C; }
  button {
    margin-top: 0.25rem;
    width: 100%;
    border: none;
    cursor: pointer;
    border-radius: 999px;
    padding: 1rem 1.5rem;
    font-size: 1rem;
    font-weight: 500;
    font-family: inherit;
    color: #FFF8F0;
    background: linear-gradient(135deg, var(--orange), var(--orange-dark));
    box-shadow: 0 12px 28px -10px rgba(232, 89, 12, 0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.75rem;
    transition: filter .15s, transform .1s;
  }
  button:hover { filter: brightness(1.05); }
  button:active { transform: scale(0.99); }
  .help { text-align: center; font-size: 0.875rem; color: var(--muted); margin-top: 2rem; }
  .help a { color: var(--orange); font-weight: 500; text-decoration: none; }
  .help a:hover { text-decoration: underline; }
  @media (max-width: 480px) { .card { padding: 2.25rem 1.5rem; } h1 { font-size: 1.875rem; } }
</style>
</head>
