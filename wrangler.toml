name = "rovaya-api"
type = "service-worker"
main = "src/worker.ts"
compatibility_date = "2024-12-01"
workers_dev = true

# Environment variables - define in Cloudflare dashboard or via wrangler secret
[env.production]
routes = [
  { pattern = "api.yourdomain.com/*", zone_name = "yourdomain.com" }
]
vars = { ENVIRONMENT = "production" }

[env.development]
vars = { ENVIRONMENT = "development" }

# R2 Bucket Binding
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "rovaya-photos"
jurisdiction = "eu"

# KV Namespace for caching (optional)
[[kv_namespaces]]
binding = "KV_CACHE"
preview_id = "kv-cache-preview"
id = "your-kv-namespace-id"

# Build configuration
[build]
command = "pnpm install && pnpm build:worker"
cwd = "."
watch_paths = ["src/**/*.ts", "server/**/*.ts", "shared/**/*.ts"]

[build.upload]
format = "modules"
main = "./dist/worker.js"

# Observability
[observability]
enabled = true
