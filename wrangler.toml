name = "rovaya-api"
main = "src/worker.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
ENVIRONMENT = "development"

# R2 Bucket Binding
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "fleet-inspection-photos"
jurisdiction = "eu"

# KV Namespace for caching
[[kv_namespaces]]
binding = "KV_CACHE"
id = "75d081729b674717944940f65bb7c7a0"

[observability]
enabled = true

# Uncomment once this API has a real domain routed through Cloudflare,
# and deploy with `wrangler deploy --env production`:
# [env.production]
# vars = { ENVIRONMENT = "production" }
# routes = [
#   { pattern = "api.yourdomain.com/*", zone_name = "yourdomain.com" }
# ]
